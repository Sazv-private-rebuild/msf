<style>
:root{
  --mid:#08142b; --deep:#0d1d3b; --field:#0f2247; --line:#25385c; --line2:#34507f;
  --gold:#c9a24a; --gold2:#e9cf8a; --gold3:#8a6a24; --text:#f2eada; --mut:#a9b5c9; --err:#ff9d8f; --ok:#8fd3a8;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --metal:linear-gradient(180deg,#f6e4a6 0%,#e0bd63 38%,#b98a2e 62%,#e6c773 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--mid)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#12285a 0%,var(--mid) 60%) fixed,var(--mid);color:var(--text);font:17px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(8,20,43,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.bar img{height:30px;width:auto}
.bar .nm{font:600 19px/1.1 var(--serif);color:var(--gold2);letter-spacing:.02em}
.bar .nm small{display:block;font:12px/1.3 var(--sans);color:var(--mut);letter-spacing:0}
.bar .sv{margin-left:auto;font-size:13px;color:var(--mut);text-align:right;max-width:44%}
.prog{height:3px;background:var(--line);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--metal);transition:width .35s ease}

/* welcome */
.hero{text-align:center;padding:34px 0 8px}
.hero picture img{width:min(300px,78vw);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.hero h1{font:600 34px/1.12 var(--serif);margin:22px 0 8px;color:var(--text)}
.hero p{color:var(--mut);margin:0 auto;max-width:30em}
.rule{height:1px;margin:26px auto;max-width:220px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.pick{display:grid;gap:12px;margin:8px 0 18px}
.pick button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;width:100%;padding:16px 18px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(180deg,#112553,#0c1c3d);cursor:pointer;min-height:64px}
.pick button b{font:600 22px/1.2 var(--serif);color:var(--gold2)}
.pick button span{grid-column:1;color:var(--mut);font-size:15px}
.pick button em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:13px;color:var(--mut);white-space:nowrap}
.pick button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.hero.one{padding:18px 0 4px}
.hero.one picture img{width:min(200px,56vw)}
.hero.one h1{font-size:32px;margin:14px 0 6px}
.hero .lead{color:var(--text);opacity:.9}
.hero .mins{font-size:14px;margin-top:6px}
.go{display:grid;gap:10px;margin:18px 0 6px}
.other{text-align:center;margin:8px 0 0}
.need{border-left:2px solid var(--gold3);padding:2px 0 2px 14px;margin:18px 0;color:var(--mut);font-size:15px}
.need b{color:var(--text);font-weight:600}

/* screen */
.head{padding:24px 0 6px}
.step{font-size:14px;color:var(--gold);margin:0 0 4px}
h2{font:600 30px/1.15 var(--serif);margin:0;outline:none}
.intro{color:var(--mut);margin:8px 0 0;font-size:15px}
form{padding:8px 0 140px}
.f{margin:22px 0 0}
.f[hidden]{display:none}
.l{display:block;font-weight:600;font-size:16px;margin:0 0 8px;color:var(--text)}
.l .opt{font-weight:400;color:var(--mut);font-size:14px}
.h{font-size:14px;color:var(--mut);margin:-4px 0 8px}
.in{position:relative}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=month],select,textarea{
  display:block;width:100%;min-height:52px;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--field);color:var(--text);-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:#7f8da6}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 14px) 23px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(201,162,74,.28)}
.money input{padding-left:30px}.money::before{content:"$";position:absolute;left:14px;top:14px;color:var(--gold);pointer-events:none}
.pct input{padding-right:34px}.pct::after{content:"%";position:absolute;right:14px;top:14px;color:var(--gold);pointer-events:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.ch{display:grid;gap:8px}
.ch.two{grid-template-columns:1fr 1fr}
.c{display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--field);cursor:pointer;font-size:16px}
.c input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;margin:0;border:1.5px solid var(--mut);border-radius:50%;display:grid;place-content:center}
.c input[type=checkbox]{border-radius:6px}
.c input::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold);transform:scale(0);transition:transform .12s}
.c input[type=checkbox]::after{border-radius:2px;width:12px;height:12px;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0,43% 62%)}
.c input:checked{border-color:var(--gold)}.c input:checked::after{transform:scale(1)}
.c:has(input:checked){border-color:var(--gold);background:#132a58}
.c input:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.bad input,.bad select,.bad textarea,.bad .c{border-color:var(--err)}
.msg{color:var(--err);font-size:14px;margin-top:6px}.msg:empty{display:none}
.alert{background:#3a1820;border:1px solid #7d3440;color:#ffd9d3;border-radius:12px;padding:12px 14px;margin:16px 0 0;font-size:15px}
.note{background:#0f2a4a;border:1px solid #23507a;border-radius:12px;padding:12px 14px;margin:16px 0 0;font-size:15px;color:#d5e3f5}

/* groups, tables */
.grp{margin:26px 0 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(13,29,59,.6)}
.grp>h3,.tbl>h3{font:600 22px/1.2 var(--serif);margin:0;color:var(--gold2)}
.grp .f:first-of-type{margin-top:14px}
.calc{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:#0a1a36;border:1px dashed var(--gold3);font-size:15px}
.calc div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.calc b{color:var(--gold2);font-weight:600;white-space:nowrap}
.calc small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.tbl{margin:26px 0 0}
.deal{margin:22px 0 0;padding:16px;border-radius:16px;border:1px solid var(--gold);background:linear-gradient(180deg,#132a58,#0c1c3d);font-size:15px}
.deal h4{font:600 19px/1.2 var(--serif);color:var(--gold2);margin:14px 0 6px}.deal h4:first-child{margin-top:0}
.deal div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid rgba(201,162,74,.15)}
.deal b{color:var(--text);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.deal b.okv{color:var(--ok)}.deal b.badv{color:var(--err)}
.deal small{display:block;color:var(--mut);font-size:12.5px;margin-top:10px}
.row{margin:12px 0 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(13,29,59,.6)}
.row .rh{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--gold2)}
.row .f{margin-top:12px}
.row .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row .grid .w{grid-column:1/-1}
.later{margin:12px 0 0}
.link{background:none;border:0;color:var(--gold2);text-decoration:underline;padding:10px 0;min-height:44px;cursor:pointer;font-size:15px}
.add{display:block;width:100%;margin:12px 0 0;min-height:50px;border-radius:12px;border:1px dashed var(--gold3);background:none;color:var(--gold2);font-weight:600;cursor:pointer}

/* docs */
.doc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.doc .dl{flex:1;min-width:58%}
.doc .dl b{display:block;font-weight:600;font-size:16px}
.doc .files{flex-basis:100%;font-size:14px;color:var(--mut)}
.doc .files div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}
.doc .files span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--gold);color:var(--gold2);font-weight:600;font-size:15px;cursor:pointer}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.up:focus-within{outline:3px solid var(--gold2);outline-offset:2px}
.secure{display:flex;gap:12px;margin:30px 0 0;padding:16px;border-radius:16px;border:1px solid #2f5a4a;background:#0c2a2a}
.secure svg{flex:none;margin-top:2px}
.secure p{margin:0;font-size:15px;color:#cfe7dc}

/* review */
.rv{margin:22px 0 0;border-top:1px solid var(--line)}
.rv section{padding:14px 0;border-bottom:1px solid var(--line)}
.rv .sh{display:flex;justify-content:space-between;align-items:baseline}
.rv h3{font:600 21px/1.2 var(--serif);margin:0;color:var(--gold2)}
.rv dl{margin:8px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;font-size:15px}
.rv dt{color:var(--mut)}.rv dd{margin:0;word-break:break-word}
.cons{margin:20px 0 0;display:grid;gap:10px}
.cons .c{align-items:flex-start;font-size:15px;line-height:1.45}
.cons .c input{margin-top:1px}

/* action bar */
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(8,20,43,.96);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.act .wrap{display:flex;gap:10px;align-items:center}
.btn{min-height:54px;border-radius:14px;border:0;padding:0 22px;font-weight:700;font-size:17px;cursor:pointer}
.pri{flex:1;background:var(--metal);color:#1d1404;box-shadow:0 6px 18px rgba(201,162,74,.22)}
.sec{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn[disabled]{opacity:.55}
.act .later2{display:block;text-align:center;font-size:14px;margin-top:4px}

/* done + sheet */
.done{text-align:center;padding:40px 0 30px}
.done h2{font-size:34px}
.ref{display:inline-block;margin:14px 0;padding:10px 18px;border-radius:12px;border:1px solid var(--gold);font:600 22px/1 var(--sans);letter-spacing:.06em;color:var(--gold2)}
.next{text-align:left;margin:24px 0 0;padding:0 0 0 20px;color:var(--mut)}
.next li{margin:6px 0}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,8,18,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:640px;background:var(--deep);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font:600 24px/1.2 var(--serif);margin:0 0 8px}
.sheet input{font-size:14px}
.sheet .btns{display:flex;gap:10px;margin-top:14px}
.offline{background:#4a3410;color:#ffe7b5;text-align:center;font-size:14px;padding:6px 12px}

footer{border-top:1px solid var(--line);padding:22px 0 calc(150px + env(safe-area-inset-bottom));font-size:12.5px;line-height:1.55;color:var(--mut)}
footer p{margin:0 0 8px}
footer.home{padding-bottom:40px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (min-width:700px){.hero h1{font-size:42px}h2{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:20px">Please turn on JavaScript to complete this application, or call or text Simon Zarour at (201) 484-9544.</p></noscript>
<div id="offline" class="offline" hidden role="status">You're offline. Your answers are kept on this phone and will save when you reconnect.</div>
<div id="app"></div>
<script>
// ===== My Source Finance — shared application schema (v3, 2026-10-20). Identical copy runs in the browser and in Apps Script. =====
// Field: {id, l: label, t: type, r: required, o: options, s: show-condition, h: help, ac: autocomplete, ph: placeholder, d: default}
// Types: text email tel money int pct date month choice select textarea check yesno table
// Show condition: {f: fieldId, eq: value} | {f, ne: value} | {f, in: [values]} | {f, nz: 1} | {all: [cond, ...]}
var MSF_SCHEMA_VERSION = 3;
var MSF_YN = ['Yes', 'No'];
var MSF_CREDIT = ['760+', '720–759', '680–719', '640–679', 'Below 640', 'Not sure'];
var MSF_TIMELINE = ['Within 30 days', '30–60 days', '60–90 days', '90+ days', 'Just exploring'];
var MSF_EXIT = ['Sell the property', 'Refinance into a long-term loan', 'Hold and rent', 'Other'];
var MSF_ENTITY = ['An LLC / corporation', 'Myself as an individual', 'Not sure yet'];
var MSF_APP_ALIAS = { multifamily: 'commercial' }; // links sent before Oct 20 keep working

var MSF_F = {
  // ---------- borrower ----------
  contact: [
    { id: 'fullName', l: 'Full legal name', t: 'text', r: 1, ac: 'name' },
    { id: 'email', l: 'Email', t: 'email', r: 1, ac: 'email' },
    { id: 'phone', l: 'Mobile phone', t: 'tel', r: 1, ac: 'tel' },
    { id: 'contactPref', l: 'Best way to reach you', t: 'choice', r: 1, o: ['Phone call', 'Text message', 'Email', 'WhatsApp'] },
    { id: 'bestTime', l: 'Best time to reach you', t: 'select', o: ['Any time', 'Morning', 'Afternoon', 'Evening'] },
    { id: 'homeAddress', l: 'Current home address', t: 'text', ac: 'street-address', ph: 'Street, city, state, ZIP' }
  ],
  resBorrower: [
    { id: 'addressYears', l: 'Time at this address', t: 'select', o: ['Under 2 years', '2–5 years', '5+ years'] },
    { id: 'maritalStatus', l: 'Marital status', t: 'select', o: ['Married', 'Unmarried', 'Separated'] },
    { id: 'dependents', l: 'Number of dependents', t: 'int' },
    { id: 'citizenship', l: 'Citizenship', t: 'select', o: ['U.S. citizen', 'Permanent resident', 'Non-permanent resident', 'Foreign national'] },
    { id: 'firstTime', l: 'First-time home buyer?', t: 'select', o: MSF_YN },
    { id: 'coBorrower', l: 'Will anyone apply with you (co-borrower)?', t: 'yesno', r: 1 },
    { id: 'coName', l: 'Co-borrower full name', t: 'text', r: 1, s: { f: 'coBorrower', eq: 'Yes' } },
    { id: 'coRelation', l: 'Relationship to you', t: 'select', o: ['Spouse', 'Partner', 'Family member', 'Other'], s: { f: 'coBorrower', eq: 'Yes' } },
    { id: 'coEmail', l: 'Co-borrower email', t: 'email', s: { f: 'coBorrower', eq: 'Yes' } },
    { id: 'coPhone', l: 'Co-borrower phone', t: 'tel', s: { f: 'coBorrower', eq: 'Yes' } },
    { id: 'coIncome', l: 'Co-borrower annual income', t: 'money', s: { f: 'coBorrower', eq: 'Yes' } }
  ],
  entity: [
    { id: 'borrowerType', l: 'Who will borrow?', t: 'choice', r: 1, o: MSF_ENTITY },
    { id: 'entityName', l: 'Legal entity name', t: 'text', r: 1, s: { f: 'borrowerType', eq: 'An LLC / corporation' } },
    { id: 'entityState', l: 'State of formation', t: 'text', s: { f: 'borrowerType', eq: 'An LLC / corporation' }, ph: 'e.g. New York' },
    { id: 'entityFormed', l: 'Date formed', t: 'month', s: { f: 'borrowerType', eq: 'An LLC / corporation' } },
    { id: 'owners', l: 'Owners and ownership %', t: 'table', s: { f: 'borrowerType', eq: 'An LLC / corporation' }, later: 1, max: 8,
      cols: [{ id: 'name', l: 'Owner name', t: 'text' }, { id: 'pct', l: 'Ownership %', t: 'pct' }, { id: 'title', l: 'Title / role', t: 'text' }, { id: 'signer', l: 'Authorized signer?', t: 'select', o: MSF_YN }, { id: 'guar', l: 'Will guarantee the loan?', t: 'select', o: MSF_YN }] },
    { id: 'guarantors', l: 'Proposed guarantor(s)', t: 'text', ph: 'Names of everyone who will personally guarantee' }
  ],
  commRole: [
    { id: 'role', l: 'You are the', t: 'select', r: 1, o: ['Borrower', 'Broker', 'Investor', 'Developer', 'Advisor', 'Other'] }
  ],
  declarations: [
    { id: 'decBankruptcy', l: 'Bankruptcy in the last 7 years?', t: 'select', o: MSF_YN },
    { id: 'decForeclosure', l: 'Foreclosure, short sale or deed-in-lieu in the last 7 years?', t: 'select', o: MSF_YN },
    { id: 'decJudgments', l: 'Outstanding judgments, liens or lawsuits?', t: 'select', o: MSF_YN },
    { id: 'decExplain', l: 'If yes, briefly explain', t: 'textarea', s: { any: ['decBankruptcy', 'decForeclosure', 'decJudgments'], eq: 'Yes' } }
  ],
  // ---------- residential ----------
  resLoan: [
    { id: 'purpose', l: 'Loan purpose', t: 'choice', r: 1, o: ['Purchase', 'Refinance', 'Cash-out refinance', 'Home equity / second mortgage'] },
    { id: 'propAddress', l: 'Property address', t: 'text', r: 1, ac: 'off', ph: 'Or city and state if you are still shopping' },
    { id: 'propType', l: 'Property type', t: 'choice', r: 1, o: ['Single-family', 'Condo / co-op', 'Townhouse', '2–4 family', 'Other'] },
    { id: 'occupancy', l: 'How will you use it?', t: 'choice', r: 1, o: ['Primary residence', 'Second home', 'Investment / rental'] },
    { id: 'value', l: 'Purchase price or estimated value', t: 'money', r: 1 },
    { id: 'loanAmt', l: 'Loan amount requested', t: 'money', r: 1 },
    { id: 'downPayment', l: 'Down payment', t: 'money', s: { f: 'purpose', eq: 'Purchase' } },
    { id: 'downSource', l: 'Source of down payment', t: 'select', o: ['Savings', 'Sale of current home', 'Gift', 'Retirement funds', 'Other'], s: { f: 'purpose', eq: 'Purchase' } },
    { id: 'mortBalance', l: 'Current mortgage balance', t: 'money', s: { f: 'purpose', ne: 'Purchase' } },
    { id: 'closeDate', l: 'Desired closing date', t: 'date' },
    { id: 'timeline', l: 'When do you need financing?', t: 'select', r: 1, o: MSF_TIMELINE }
  ],
  resFin: [
    { id: 'employment', l: 'Employment', t: 'choice', r: 1, o: ['W-2 employee', 'Self-employed / business owner', 'Retired', 'Other'] },
    { id: 'employer', l: 'Employer or business name', t: 'text', s: { f: 'employment', in: ['W-2 employee', 'Self-employed / business owner'] }, ac: 'organization' },
    { id: 'occupation', l: 'Position / occupation', t: 'text', s: { f: 'employment', in: ['W-2 employee', 'Self-employed / business owner'] }, ac: 'organization-title' },
    { id: 'jobYears', l: 'Time in this line of work', t: 'select', o: ['Under 2 years', '2–5 years', '5+ years'], s: { f: 'employment', in: ['W-2 employee', 'Self-employed / business owner'] } },
    { id: 'income', l: 'Annual income (before tax)', t: 'money', r: 1 },
    { id: 'incomeSources', l: 'Other income (bonus, rental, pension…)', t: 'text' },

  }

// ---------- uploads ----------
var EXT = /\.(pdf|jpe?g|png|heic|heif|docx|xlsx)$/i;
function shrink(file) { // resize large phone photos before upload (keeps documents legible)
  return new Promise(function (res) {
    if (!/^image\/(jpeg|png)$/.test(file.type) || file.size < 2.5 * 1048576) return res(file);
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 2400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { res(b && b.size < file.size ? new File([b], file.name.replace(/\.(png|jpe?g)$/i, '') + '.jpg', { type: 'image/jpeg' }) : file); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
function b64(file) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1] || ''); }; r.onerror = function () { rej(new Error('Could not read this file.')); }; r.readAsDataURL(file); }); }
function uploadAll(cat, files) {
  var list = $('#fl_' + cat), chain = Promise.resolve();
  var ensure = S.token ? Promise.resolve(true) : new Promise(function (res) { save(function (ok) { res(ok && S.token); }); });
  files.forEach(function (file) {
    var line = document.createElement('div'); line.innerHTML = '<span>Preparing ' + esc(file.name) + '…</span>'; list.appendChild(line);
    var err = function (m) { line.innerHTML = '<span style="color:var(--err);white-space:normal">' + esc(file.name) + ': ' + esc(m) + '</span>'; };
    if (!EXT.test(file.name) && !/^image\//.test(file.type)) { err('use PDF, JPG, PNG, HEIC, Word or Excel.'); return; }
    chain = chain.then(function () { return ensure; }).then(function (ok) {
      if (!ok) throw new Error('No connection — try again when you have signal.');
      return shrink(file);
    }).then(function (f) {
      var name = EXT.test(f.name) ? f.name : f.name + (f.type === 'image/png' ? '.png' : '.jpg');
      if (f.size > 10 * 1048576) throw new Error('larger than 10 MB. Please send a smaller copy.');
      line.innerHTML = '<span>Uploading ' + esc(name) + ' (' + kb(f.size) + ')…</span>';
      return b64(f).then(function (data) { return api('upload', { token: S.token, app: APP, cat: cat, name: name, b64: data }, 2); });
    }).then(function (u) {
      S.ups.push(u); line.innerHTML = '<span>✓ ' + esc(u.name) + ' · ' + kb(u.size) + '</span><button type="button" class="link" data-rm="' + esc(u.uid) + '" aria-label="Remove ' + esc(u.name) + '">Remove</button>';
      var lab = line.closest('.doc'); if (lab) $('.up', lab).firstChild.nodeValue = 'Add more';
    }).catch(function (e) { err(e.message || 'upload failed.'); });
  });
}
function removeUpload(uid, b) {
  b.disabled = true; b.textContent = 'Removing…';
  api('deleteUpload', { token: S.token, uid: uid }).then(function () { S.ups = S.ups.filter(function (u) { return u.uid !== uid; }); b.parentNode.remove(); })
    .catch(function (e) { b.disabled = false; b.textContent = 'Remove'; var m = document.createElement('span'); m.style.color = 'var(--err)'; m.textContent = ' ' + e.message; b.parentNode.appendChild(m); });
}
