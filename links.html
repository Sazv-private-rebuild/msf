<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MSF Links</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MSF Links">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08142b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--mid:#08142b;--line2:#34507f;--gold:#c9a24a;--gold2:#e9cf8a;--text:#f2eada;--mut:#a9b5c9;--ok:#8fd3a8;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--mid)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#12285a 0%,var(--mid) 60%) fixed,var(--mid);color:var(--text);font:17px/1.5 var(--sans)}
.wrap{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
header{text-align:center;padding:8px 0 18px}
header img{height:56px;width:auto}
h1{font:600 26px/1.2 var(--serif);color:var(--gold2);margin:8px 0 2px}
header p{margin:0;color:var(--mut);font-size:14px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(180deg,#132a55,#0d1d3b)}
li a.open{flex:1;min-width:0;text-decoration:none;color:inherit}
li b{display:block;font:600 20px/1.2 var(--serif);color:var(--gold2)}
li span{display:block;font-size:14px;color:var(--mut)}
button{font:600 16px/1 var(--sans);min-width:88px;min-height:48px;padding:0 16px;border-radius:12px;border:0;background:linear-gradient(180deg,#f6e4a6,#c9a24a);color:#08142b;cursor:pointer}
button.done{background:var(--ok)}
footer{margin-top:24px;text-align:center;color:var(--mut);font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <img src="msf-mark-96.png" width="96" height="100" alt="">
    <h1>My Source Finance</h1>
    <p>Tap a name to open it. Tap Send to text or email the link.</p>
  </header>
  <ul id="list"></ul>
  <footer>My Source Finance · Simon Zarour, NMLS #2684220 · Powered by Alpine Mortgage Services, LLC, NMLS #56905 · Equal Housing Opportunity</footer>
</main>
<script>
var LINKS = [
  ['residential', 'Residential Mortgage', 'Purchase or refinance a home'],
  ['commercial', 'Commercial Loan', '$1M–$70M commercial property'],
  ['construction', 'Construction Financing', 'Ground-up and major renovation'],
  ['private', 'Private / Fix & Flip', 'Bridge, fix-and-flip, rentals'],
  ['multifamily', 'Multifamily Loan', '5+ unit apartment buildings'],
  ['dscr', 'DSCR Calculator', 'Instant DSCR, NOI and loan estimate']
];
var base = location.origin + location.pathname.replace(/links(\.html)?\/?$/, ''); // works for /links and /links.html
document.getElementById('list').innerHTML = LINKS.map(function (l, i) {
  return '<li><a class="open" href="' + base + '?app=' + l[0] + '"><b>' + l[1] + '</b><span>' + l[2] + '</span></a><button type="button" data-i="' + i + '" aria-label="Send ' + l[1] + ' link">Send</button></li>';
}).join('');
document.getElementById('list').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var l = LINKS[b.dataset.i], url = base + '?app=' + l[0];
  var text = 'My Source Finance — ' + l[1] + (l[0] === 'dscr' ? '' : ' application');
  if (navigator.share) { navigator.share({ title: text, text: text, url: url }).catch(function () {}); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () {
    b.textContent = 'Copied'; b.classList.add('done'); setTimeout(function () { b.textContent = 'Send'; b.classList.remove('done'); }, 1500);
  }).catch(function () { prompt('Copy this link', url); });
});
</script>
</body>
</html>
